# Deploy-time overlay for docker-compose.yml, used only by the .gitlab-ci.yml
# deploy stage on the target VM. Points server/client at the images the CI
# pipeline just built and pushed to this project's Container Registry, instead
# of the upstream opensign/* images (docker-compose.yml) or a from-source build
# (docker-compose.override.yml, which is for local dev only and must NOT be
# combined with this file).
#
# Usage on the VM (done by the CI deploy stage, shown here for reference):
#   SERVER_IMAGE=registry.example/.../server:<sha> \
#   CLIENT_IMAGE=registry.example/.../client:<sha> \
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d
services:
  server:
    image: ${SERVER_IMAGE}
  client:
    image: ${CLIENT_IMAGE}
