# CI/CD for the Dohome OpenSign fork.
#
# The shared GitLab Runner here uses the "shell" executor with no Docker
# access for the gitlab-runner service account (`docker login` fails with
# "permission denied" on /var/run/docker.sock), so we can't build images in
# CI. Instead this pipeline just SSHes into the target VM and builds from
# source there, the same way local dev does (docker-compose.yml +
# docker-compose.override.yml, see that file's header).
#
# Required CI/CD variables (Settings > CI/CD > Variables, masked + protected,
# restricted to the `staging` branch):
#   DEPLOY_SSH_HOST   - hostname/IP of the target VM
#   DEPLOY_SSH_USER   - SSH user on that VM
#   DEPLOY_SSH_KEY    - private key (PEM) matching a public key already
#                       authorized on that VM for DEPLOY_SSH_USER
#   DEPLOY_PATH       - absolute path on the VM to this repo's checkout
#                       (must already be `git clone`d there once, on branch
#                       `staging`, with a real .env.prod alongside it)

stages:
  - deploy

deploy:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
  before_script:
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts
  script:
    - >
      ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST"
      "set -e &&
      cd '$DEPLOY_PATH' &&
      git fetch origin staging &&
      git reset --hard origin/staging &&
      docker compose -f docker-compose.yml -f docker-compose.override.yml up -d --build --remove-orphans"
